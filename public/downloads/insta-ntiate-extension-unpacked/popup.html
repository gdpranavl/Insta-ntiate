<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Insta-ntiate Collector</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <main class="shell">
      <header>
        <div class="mark">IN</div>
        <div>
          <p class="eyebrow">Manual sync</p>
          <h1>Digital world collector</h1>
        </div>
      </header>

      <div class="status">
        <p class="label">Status</p>
        <strong id="statusText">Idle</strong>
        <p id="statusDetail" class="detail">Ready to collect from selected socials.</p>
      </div>

      <div class="status compact">
        <p class="label">Selected platforms</p>
        <p id="selectedPlatforms" class="detail">loading...</p>
      </div>

      <button id="syncBtn" class="btn primary" type="button">Manual sync now</button>
      <button id="optionsBtn" class="btn ghost" type="button">Choose socials</button>
      <button id="exportBtn" class="btn text" type="button">Download archive JSON</button>
    </main>
    <script src="./popup.js"></script>
  </body>
</html>
