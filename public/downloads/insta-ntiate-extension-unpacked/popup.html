<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Insta-ntiate Collector</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <main class="shell">
      <header>
        <div class="mark">IN</div>
        <div>
          <p class="eyebrow">Background sync</p>
          <h1>Insta-ntiate</h1>
        </div>
      </header>

      <div class="status">
        <p class="label">Status</p>
        <strong id="statusText">Idle</strong>
        <p id="statusDetail" class="detail">No sync yet.</p>
      </div>

      <button id="syncBtn" class="btn primary" type="button">Sync now</button>
      <button id="optionsBtn" class="btn ghost" type="button">Open settings</button>
      <button id="exportBtn" class="btn text" type="button">Download archive JSON</button>

      <p class="hint">This collector is for users who want scheduled background sync. For one-shot scans, use the bookmarklet on the web app — no install required.</p>
    </main>
    <script src="./popup.js"></script>
  </body>
</html>
